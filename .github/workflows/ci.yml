name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run lint:package
      - name: Pack the tarball
        run: |
          bun pm pack
          mv restless-dreams-orbit-*.tgz orbit.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            orbit.tgz
            scripts/smoke-test.mjs

  smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
        peers: [react react-dom marked]
        include:
          # The oldest versions the peer ranges allow, on the oldest Node.
          - node: 20
            peers: react@18.0.0 react-dom@18.0.0 marked@12.0.0
          # The core alone: the CLI, the renderer and the web page need none of the peers.
          - node: 20
            peers: ''
            smoke: --without-peers
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the packed package into a fresh project
        run: |
          mkdir smoke
          cp scripts/smoke-test.mjs smoke/
          cd smoke
          npm init -y > /dev/null
          npm pkg set type=module
          npm install ../orbit.tgz ${{ matrix.peers }}
      - name: Exercise every entry point and the CLI
        working-directory: smoke
        run: node smoke-test.mjs ${{ matrix.smoke }}

  older-peers:
    # The React wrapper's and the marked extension's tests on the oldest React
    # and marked the peer ranges allow. React 18.3 is the first with act() in
    # react, which the tests use; the smoke job renders on 18.0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun add --dev react@18.3.1 react-dom@18.3.1 marked@12.0.0
      - run: bun test tests/react.test.ts tests/marked.test.ts

  browser:
    # The Playwright image pins the browser and fonts, so screenshots match
    # the ones in e2e/screenshots/ (made with `bun run test:browser`).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      # The screenshots and the test pages' pictures are in Git LFS, which the checkout needs.
      - name: Install Git LFS, and unzip for setup-bun
        run: apt-get update && apt-get install -y --no-install-recommends git git-lfs unzip
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Keep Chromium 99 between runs
        uses: actions/cache@v4
        with:
          path: /root/.cache/orbit
          key: older-chromium-961656
      - name: Draw maps in Chromium 99, the oldest WebView Orbit for Android draws them in
        run: bun run check:older-chromium
        env:
          HOME: /root
      - name: Spin, zoom and navigation in Chromium (desktop and phone), Firefox and WebKit, and screenshots in Chromium
        run: node node_modules/@playwright/test/cli.js test
        env:
          HOME: /root
      # Advisory for now: the budgets were set on a 24-core desktop, with three times the headroom, and GitHub's
      # runners are slower per core, so a limit may sit close here without anything getting slower. The step prints
      # each measured value against its budget, in its log and in the run's summary. Once the first few runs have
      # given real numbers, set the desktop budgets from them and make the step blocking (RELEASE.md).
      - name: Orbit's own script time in flights, zooms, pans and the first draw, against its budgets
        run: node scripts/bench-animations.mjs --budgets --runs=3
        continue-on-error: true
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
