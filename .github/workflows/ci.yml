name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run lint:package
      - name: Pack the tarball
        run: |
          bun pm pack
          mv restless-dreams-orbit-*.tgz orbit.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            orbit.tgz
            scripts/smoke-test.mjs

  smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the packed package into a fresh project
        run: |
          mkdir smoke
          cp scripts/smoke-test.mjs smoke/
          cd smoke
          npm init -y > /dev/null
          npm pkg set type=module
          npm install ../orbit.tgz react react-dom marked
      - name: Exercise every entry point and the CLI
        working-directory: smoke
        run: node smoke-test.mjs

  browser:
    # The Playwright image pins the browser and fonts, so screenshots match
    # the ones in e2e/screenshots/ (made with `bun run test:browser`).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      # The screenshots and the test pages' pictures are in Git LFS, which the checkout needs.
      - name: Install Git LFS, and unzip for setup-bun
        run: apt-get update && apt-get install -y --no-install-recommends git git-lfs unzip
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Spin, zoom, navigation and screenshots in Chromium (desktop and phone)
        run: node node_modules/@playwright/test/cli.js test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
