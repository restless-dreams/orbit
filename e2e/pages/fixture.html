<title>Orbit test fixture</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #ffffff; }
  #map { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="map"></div>
<script type="module">
  // Renders one sample map from the query string, for the browser tests:
  // ?sample=roadmap&theme=night&view=all&focus=build&instant (and &flat for a container without a height, &editable for editing on the map,
  // &font and &spacing for the page's own lettering). sample=large is the made-up large map (scripts/large-map.js).
  import { createOrbitMap, themeTokens } from '../dist/index.js';
  import { createDemoExtensions, createSamples } from './samples.js';

  const parameters = new URLSearchParams(location.search);
  const samples = createSamples((name) => new URL(`img/${name}`, document.baseURI).href);
  const theme = parameters.get('theme') ?? 'paper';
  document.body.dataset.theme = theme;
  // The page behind themes without a background of their own is white.
  const surface = themeTokens(theme).surface;
  document.body.style.background = surface === 'transparent' ? '#ffffff' : surface;
  if (parameters.has('flat')) {
    // A container without a height, the most common setup mistake.
    document.getElementById('map').style.height = 'auto';
  }
  // The page's own lettering: &font=<a sans-serif font family>&spacing=<letter spacing>.
  if (parameters.get('font')) {
    document.getElementById('map').style.setProperty('--orbit-sans-font', parameters.get('font'));
  }
  if (parameters.get('spacing')) {
    document.getElementById('map').style.setProperty('--orbit-label-letter-spacing', parameters.get('spacing'));
  }
  const source = parameters.get('sample') === 'large'
    ? (await import('./large-map.js')).largeMap()
    : samples[parameters.get('sample') ?? 'roadmap'].source;
  const map = createOrbitMap(document.getElementById('map'), source, {
    theme,
    viewMode: parameters.get('view') ?? 'focus',
    transitionDuration: parameters.has('instant') ? 0 : 'auto',
    spin: parameters.has('snap') ? { snap: 'planet' } : undefined,
    editable: parameters.has('editable'),
    editingKeys: parameters.has('editable'),
    ...createDemoExtensions(),
  });
  if (parameters.get('focus')) {
    map.flyTo(parameters.get('focus'));
  }
  window.map = map;
  document.body.dataset.ready = 'true';
</script>
</body>
</html>
